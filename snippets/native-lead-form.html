<!--
  АРХИВ: НАТИВНАЯ ФОРМА ЗАЯВКИ (.lead-form)
  Заменена на встроенную CRM-форму Bitrix24 2026-08-10 (PR #23).

  Как вернуть:
  1. В index.html внутри .form-card (секция #audit) удалить .b24-form-slot
     (вместе со скриптом data-b24-form) и .b24-fallback, на их место вставить
     <form class="lead-form"> из этого файла.
  2. Логика формы в app.js не удалялась: валидация, маска телефона, черновик
     в localStorage, отправка на webhookUrl из config.js — всё под проверкой
     if (form) и оживёт само, как только форма появится в DOM.
  3. Наблюдатель загрузки Bitrix24-виджета в app.js (блок data-b24-slot)
     при возврате нативной формы нужно удалить, как и стили .b24-form-slot /
     .b24-fallback в конце styles.css.
  4. Скрытые поля consent_given_at / policy_version — аудиторский след согласия
     по 152-ФЗ; при возврате формы проверить актуальность policy_version.
-->

<form class="lead-form" data-lead-form novalidate>
  <div class="form-grid">
    <label><span>Имя *</span><input name="name" autocomplete="name" required placeholder="Как к вам обращаться"></label>
    <label><span>Телефон *</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+7 (___) ___-__-__"></label>
    <label><span>Удобный канал связи</span><select name="channel"><option>Телефон</option><option>Telegram</option><option>WhatsApp</option><option>Email</option></select></label>
    <label><span>Площадка</span><select name="marketplace"><option>Wildberries</option><option>Ozon</option><option>Wildberries и Ozon</option><option>Планируем выход</option></select></label>
    <label class="span-2"><span>Ссылка на магазин или товар</span><input name="store_url" type="url" placeholder="https://..."></label>
    <label class="span-2"><span>Коротко о задаче</span><textarea name="comment" rows="4" placeholder="Что происходит сейчас и какой результат нужен?"></textarea></label>
  </div>
  <input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign"><input type="hidden" name="utm_content"><input type="hidden" name="utm_term"><input type="hidden" name="page_url">
  <input type="hidden" name="consent_given_at"><input type="hidden" name="policy_version" value="2026-06-30">
  <label class="honeypot" aria-hidden="true">Компания<input name="company_website" tabindex="-1" autocomplete="off"></label>
  <label class="consent"><input type="checkbox" name="consent" required><span>Даю согласие на обработку персональных данных (имя, телефон и иные указанные в форме данные) в целях обработки заявки и связи со мной в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» и принимаю <a href="privacy.html#consent" target="_blank" rel="noopener">политику конфиденциальности и условия согласия</a>.</span></label>
  <small class="form-error" data-form-error></small>
  <button class="btn btn-primary btn-lg" type="submit"><span>Получить бесплатный разбор</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <p class="form-note">Форма готова к подключению к n8n или CRM через webhook.</p>
</form>
